<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Kit Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #171923 0%, #0d0e15 100%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 30px;
    }
    .logo-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }
    .logo-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      border-radius: 20px;
      filter: blur(16px);
      opacity: 0.6;
      animation: pulse 2.5s ease-in-out infinite;
    }
    .logo-icon {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .logo-icon svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #818cf8;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      margin-bottom: 24px;
    }
    .loader-bar {
      width: 260px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }
    .loader-bar-inner {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      border-radius: 9999px;
      animation: indeterminate 1.8s infinite ease-in-out;
    }
    .status-text {
      font-size: 13px;
      color: #94a3b8;
      min-height: 20px;
      transition: color 0.2s;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
    </div>
    <h1>FLOW KIT</h1>
    <div class="badge">DESKTOP WORKSPACE</div>
    <div class="loader-bar">
      <div class="loader-bar-inner"></div>
    </div>
    <div id="status" class="status-text">Äang khá»Ÿi Ä‘á»™ng tiáº¿n trÃ¬nh há»‡ thá»‘ng...</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('status-update', (_, text) => {
      const el = document.getElementById('status');
      if (el) el.textContent = text;
    });
  </script>
</body>
</html>
